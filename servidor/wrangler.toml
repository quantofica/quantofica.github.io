name = "quantofica-conta"
main = "worker.js"
compatibility_date = "2026-10-01"

[vars]
EMAIL_PROVIDER = "resend"
EMAIL_FROM = "QuantoFica <conta@mail.quantofica.com.pt>"
ALLOWED_ORIGINS = "https://quantofica.github.io,capacitor://localhost,https://localhost"
GRACE_DAYS = "3"

# Limite de pedidos de login por IP (10 por minuto)
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# Segredos (não ficam neste ficheiro):
